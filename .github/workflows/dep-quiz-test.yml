name: finalize-issue-371

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'Prepare: Checkout feature branch'
        uses: actions/checkout@v4
        with:
          ref: codex/issue-371-confidence-review-reanalysis
          fetch-depth: 0

      - name: 'Prepare: Setup Node.js runtime'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'Prepare: Install npm dependencies'
        run: npm ci

      - name: 'Finalize: Format and catalog Issue 371 coverage'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/testing/e2e-test-catalog.md';
          const marker = '\n## GitHub Actions log expectations\n';
          const section = [
            '## Confidence E4 integration coverage',
            '',
            '- Spec: `tests/e2e/dep-confidence-review-reanalysis.spec.ts`',
            '- Suite: `[DEP][FLOW] Confidence analysis / Review and reanalysis`',
            '- Cases:',
            '  - `reclassifies wrong high to correct high after suspend reload resume and completion`',
            '  - `rederives the empty confidence analysis after learning history reset`',
            '  - `reaches the quiz from the confidence analysis without mobile overflow`',
            '- Responsibility: connects the completed confidence analysis UI to the existing target-list, `weaknessReview`, progress persistence, result return, and latest-state reclassification contracts without duplicating the focused suites.',
            '- E4 gate: `test:dep-confidence-e4` runs the analysis Unit, target/session Unit, focused UI/target E2E, and this integration suite before the full DEP E2E run; GitHub Actions exposes it as `Quality Gate: Run DEP confidence E4 tests`.',
          ].join('\n');
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes('tests/e2e/dep-confidence-review-reanalysis.spec.ts')) {
            if (!source.includes(marker)) throw new Error('Catalog insertion marker not found.');
            fs.writeFileSync(path, source.replace(marker, `\n${section}\n${marker}`));
          }
          NODE
          npx prettier --write tests/e2e/dep-confidence-review-reanalysis.spec.ts docs/testing/e2e-test-catalog.md

      - name: 'Finalize: Restore DEP workflow and add E4 gate'
        run: |
          git show origin/main:.github/workflows/dep-quiz-test.yml > .github/workflows/dep-quiz-test.yml
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/dep-quiz-test.yml';
          const marker = "      - name: 'Quality Gate: Run DEP confidence E3 tests'\n        run: npm run test:dep-confidence-e3\n";
          const addition = `${marker}\n      - name: 'Quality Gate: Run DEP confidence E4 tests'\n        run: npm run test:dep-confidence-e4\n`;
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes('Quality Gate: Run DEP confidence E4 tests')) {
            if (!source.includes(marker)) throw new Error('E3 workflow insertion marker not found.');
            fs.writeFileSync(path, source.replace(marker, addition));
          }
          NODE

      - name: 'Finalize: Commit generated files'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/dep-confidence-review-reanalysis.spec.ts docs/testing/e2e-test-catalog.md .github/workflows/dep-quiz-test.yml
          git commit -m 'Finalize confidence E4 quality gate'
          git push origin HEAD:codex/issue-371-confidence-review-reanalysis
