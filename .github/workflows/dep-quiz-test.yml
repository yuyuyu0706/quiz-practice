name: dep-quiz-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================
      # Prepare Phase
      # ======================
      - name: 'Prepare: Checkout repository'
        uses: actions/checkout@v4

      - name: 'Prepare: Setup Node.js runtime'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'Prepare: Install npm dependencies'
        run: npm ci

      - name: 'Prepare: Install Playwright browser'
        run: npx playwright install --with-deps chromium

      # ======================
      # Quality Gates
      # ======================
      - name: 'Quality Gate: Check code formatting'
        run: npm run format:check

      - name: 'Quality Gate: Test feature implementation document validator'
        run: npm run test:feature-doc-validator

      - name: 'Quality Gate: Validate feature implementation documents'
        run: npm run validate:feature-docs

      - name: 'Quality Gate: Run question validator unit tests'
        run: npm run test:question-validator

      - name: 'Quality Gate: Validate DEP question schema'
        run: npm run validate:dep-questions

      - name: 'Quality Gate: Run DEP variant selection unit tests'
        run: npm run test:dep-variant-selection

      - name: 'Quality Gate: Run DEP question authoring foundation tests'
        run: npm run test:dep-question-authoring-foundation

      - name: 'Quality Gate: Run DEP confidence foundation tests'
        run: npm run test:dep-confidence-foundation

      - name: 'Quality Gate: Run DEP confidence history persistence foundation tests'
        run: npm run test:dep-confidence-history-foundation

      - name: 'Quality Gate: Run DEP confidence history analysis tests'
        run: npm run test:dep-confidence-history-analysis-foundation

      - name: 'Quality Gate: Run DEP confidence analysis unit tests'
        run: npm run test:dep-confidence-analysis

      - name: 'Quality Gate: Run DEP wrong-reason-tag unit tests'
        run: npm run test:dep-wrong-reason-tags

      - name: 'Quality Gate: Run DEP weakness analysis unit tests'
        run: npm run test:dep-weakness-summary

      - name: 'Quality Gate: Run DEP weakness review target unit tests'
        run: npm run test:dep-weakness-review-targets

      - name: 'Quality Gate: Run DEP weakness review session unit tests'
        run: npm run test:dep-weakness-review-session

      - name: 'Quality Gate: Run DEP learning-history-reset unit tests'
        run: npm run test:dep-learning-history-reset

      - name: 'Quality Gate: Run DEP learning-history-reset storage unit tests'
        run: npm run test:dep-learning-history-reset-storage

      - name: 'Quality Gate: Validate E2E test catalog'
        run: npm run validate:e2e-catalog

      - name: 'Quality Gate: Run DEP variant session E2E tests'
        run: npm run test:dep-variant-session-e2e

      - name: 'Quality Gate: Run DEP question authoring E2E tests'
        run: npm run test:dep-question-authoring-e2e

      - name: 'Quality Gate: Run DEP confidence E2 tests'
        run: npm run test:dep-confidence-e2

      - name: 'Quality Gate: Run DEP confidence E3 tests'
        run: npm run test:dep-confidence-e3

      - name: 'Quality Gate: Run DEP confidence E4 tests'
        run: npm run test:dep-confidence-e4

      - name: 'Quality Gate: Run DEP confidence history UI tests'
        run: npm run test:dep-confidence-history-ui-e2e

      - name: 'Quality Gate: Run DEP confidence E5 tests'
        run: npm run test:dep-confidence-e5

      # ======================
      # E2E Coverage
      # ======================
      - name: 'Quality Gate: Run DEP E2E tests'
        run: |
          echo "Catalog: docs/testing/e2e-test-catalog.md"
          echo "Catalog URL: https://github.com/yuyuyu0706/quiz-practice/blob/main/docs/testing/e2e-test-catalog.md"
          echo "Suite naming: [DEP][UI|FLOW|DATA] Feature / Screen"
          npx playwright test tests/e2e/dep-*.spec.ts

      # ======================
      # Reporting
      # ======================
      - name: 'Report: Upload Playwright artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
